name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Satellite imagery: the key lives in the repo secret ARCGIS_KEY (never in git).
      # It is written into site/config.json at deploy time only. The key is still visible
      # to visitors, as any map key is; its HTTP-referrer restriction is what protects it.
      # A bad key only turns satellite off (with a warning); it never blocks the deploy.
      - name: Write satellite config
        env:
          ARCGIS_KEY: ${{ secrets.ARCGIS_KEY }}
        run: |
          if [ -z "$ARCGIS_KEY" ]; then echo "No ARCGIS_KEY secret: satellite stays off."; exit 0; fi
          BASE=https://ibasemaps-api.arcgis.com/arcgis/rest/services/World_Imagery/MapServer
          curl -sSf -H "Referer: https://dimoai25.github.io/" "$BASE?f=json&token=$ARCGIS_KEY" -o /tmp/self.json \
            || { echo "::warning::ArcGIS rejected the key or the imagery style path, so satellite stays off. Check the key's privileges (Basemaps: Static basemap tiles) and referrers."; exit 0; }
          python3 - <<'EOF'
          import json, os
          self = json.load(open('/tmp/self.json'))
          if 'error' in self:
              print('::warning::ArcGIS said no, satellite stays off: ' + json.dumps(self['error'])); raise SystemExit(0)
          base = 'https://ibasemaps-api.arcgis.com/arcgis/rest/services/World_Imagery/MapServer'
          credit = self.get('copyrightText') or 'Esri'
          cfg = {'satellite': {'url': base + '/tile/{z}/{y}/{x}?token=' + os.environ['ARCGIS_KEY'],
                               'attribution': 'Powered by Esri | ' + credit, 'maxZoom': 19, 'tileSize': 256}}
          json.dump(cfg, open('site/config.json', 'w'))
          print('Satellite config written. Credit:', credit)
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
